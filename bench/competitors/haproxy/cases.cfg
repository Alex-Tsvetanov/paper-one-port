# HAProxy 3.4.6: the cases configuration (hypotheses.md section 10 and Appendix B; design/proposal.md
# section 6, CP2), for the competitors' outcomes on the hard cases of Appendix A that HAProxy's
# features cover. Every route those features cover (Appendix B: use_backend on req.ssl_sni,
# req.proto_http, req.payload(0,4) for SSH- and mqtt_is_valid; default_backend for the fallback),
# and the h2c preface, which a TCP frontend can match by its bytes (survey 2.3). Two listeners:
# PORT without PROXY, PORT_PROXY with the PROXY header required (accept-proxy, v1 and v2;
# HAProxy consumes it). Two kinds from this one file: "cases", no fallback; "cases-fallback",
# default_backend the SMTP port, which takes a connection whose inspect delay ended with no rule
# matched (survey 2.3), a silent one among them. competitors.py renders a line beginning with the
# field FALLBACK as a comment in "cases", and one beginning with MATCHED as a comment at HAProxy's
# defaults (section 10: "at matched timers and at their defaults"). The backend is the server in
# dedicated mode, PROXY off, its listeners from BACKEND_HTTP in the order of I20 (M2b reading 6).
# Line numbers cite doc/configuration.txt of v3.4.6.

global
    # One thread from taskset (Appendix B; line 3115). No log line (Appendix B).

defaults
    mode tcp                         # Appendix B
    # timeout client, server and connect: not set (M4a reading 2 of the revision log).

frontend cases
    bind 127.0.0.1:@PORT@
    bind 127.0.0.1:@PORT_PROXY@ accept-proxy                     # the PROXY header required (line 17240)
@MATCHED@    tcp-request inspect-delay @TIMER_S@s                        # matched to T_dec; HAProxy has no default and then waits for nothing
@MATCHED@    timeout client-hs @TIMER_S@s                                # matched to T_hdr: bounds the wait for the PROXY header (survey 2.3); else timeout client
    acl h2c_preface req.payload(0,24) -m bin 505249202a20485454502f322e300d0a0d0a534d0d0a0d0a   # RFC 9113 section 3.4
    acl ssh_ident req.payload(0,4) -m bin 5353482d                                             # "SSH-" (RFC 4253 section 4.2)
    acl mqtt_connect req.payload(0,0),mqtt_is_valid                                            # MQTT 3.1, 3.1.1 and 5.0 CONNECT (line 22649)
    acl tls_alpn req.ssl_alpn -m str h2 http/1.1                                               # the ALPN the backend's TLS port serves
    acl tls_has_alpn req.ssl_alpn -m found                                                     # an ALPN extension at all ("found", line 20731)
    tcp-request content accept if { req.ssl_hello_type 1 }       # Appendix B: a whole ClientHello
    tcp-request content accept if HTTP                           # req.proto_http (M4a reading 1)
    tcp-request content accept if h2c_preface or ssh_ident or mqtt_connect
    # TLS for oneport.test with no ALPN, or whose ALPN offers h2 or http/1.1: the server's
    # pass-through route table (bench/server/relay.cpp), exactly. req.ssl_alpn returns no sample
    # for a ClientHello without the extension (src/payload.c, smp_fetch_ssl_hello_alpn), so
    # "found" is false there. The route without ALPN was added before the code freeze (Appendix
    # B: "every route its features cover"; M4b-1's reading 4 had left it out).
    use_backend tls_backend if { req.ssl_sni -m str oneport.test } tls_alpn
    use_backend tls_backend if { req.ssl_sni -m str oneport.test } !tls_has_alpn
    use_backend h2c_backend if h2c_preface
    use_backend http_backend if HTTP
    use_backend ssh_backend if ssh_ident
    use_backend mqtt_backend if mqtt_connect
@FALLBACK@    default_backend smtp_backend                                # Appendix B: the fallback

backend http_backend
    server s 127.0.0.1:@BACKEND_HTTP@

backend h2c_backend
    server s 127.0.0.1:@BACKEND_H2C@

backend tls_backend
    server s 127.0.0.1:@BACKEND_TLS@

backend mqtt_backend
    server s 127.0.0.1:@BACKEND_MQTT@

backend ssh_backend
    server s 127.0.0.1:@BACKEND_SSH@

@FALLBACK@backend smtp_backend
@FALLBACK@    server s 127.0.0.1:@BACKEND_SMTP@
