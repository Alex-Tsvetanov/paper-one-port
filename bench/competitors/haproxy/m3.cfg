# HAProxy 3.4.6: the M3 configuration (hypotheses.md 5.3 and Appendix B; design/proposal.md section
# 6, CP2). Exactly M3's two routes: TLS by SNI (oneport.test) to the stub's TLS port, everything
# else to the stub's HTTP/1.1 port. bench/competitors/competitors.py renders it, filling every field
# written between @ signs. Every setting that differs from HAProxy's default says why. The B3
# configuration (b3.cfg) is this one plus WL7's limits, the 60 s timer and the buffer rule. Line
# numbers cite doc/configuration.txt of v3.4.6.

global
    # nbthread: not set. HAProxy runs as many threads as CPUs it is bound to at startup, and taskset
    # binds it to the front core, so one thread (Appendix B; line 3115).
    # No log line: HAProxy logs only through log lines (Appendix B; audit F9.1).
    # maxconn: not set in M3; HAProxy computes it from the descriptor limits (line 3951).
    # option splice-auto: set in defaults only if the server's relay splices (section 8, rule E); the
    # runner fills the field from the relay copy of the server's arm in the same cell (competitors.SPLICE_AUTO).

defaults
    mode tcp                         # Appendix B
    @SPLICE_AUTO@
    # timeout client, server and connect: not set, HAProxy's default, an infinite timeout, which it
    # accepts with a startup warning (lines 14782 to 14785). No value is documented for this use, and
    # the client timeout "must cover at least the inspection delay" (line 14540), which an infinite one does.

frontend m3
    bind 127.0.0.1:@PORT@            # backlog: HAProxy passes the frontend's maxconn to listen() (Appendix B; line 6383)
    tcp-request inspect-delay @TIMER_S@s                        # matched to the server's T_dec (section 1: 3 s; Appendix B)
    tcp-request content accept if { req.ssl_hello_type 1 }      # Appendix B: a TLS ClientHello is released at once
    tcp-request content accept if HTTP                          # Appendix B (req.proto_http): so is plaintext HTTP/1.1, not at the delay's end
    use_backend tls_stub if { req.ssl_sni -m str oneport.test } # M3's first route: TLS by SNI (Appendix B: use_backend on req.ssl_sni)
    default_backend http_stub                                   # M3's second route: everything else

backend tls_stub
    server stub 127.0.0.1:@STUB_TLS@

backend http_stub
    server stub 127.0.0.1:@STUB_HTTP@
