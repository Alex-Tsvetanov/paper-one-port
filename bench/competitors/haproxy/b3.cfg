# HAProxy 3.4.6: the B3 configuration (hypotheses.md WL7, 5.2 and Appendix B; design/proposal.md
# section 6, CP2). The M3 configuration (m3.cfg) plus WL7's limits for N_PEND = @N_PEND@ pending
# connections, the 60 s timer of section 1, and the buffer rule of Appendix B.
# bench/competitors/competitors.py renders it. Line numbers cite doc/configuration.txt of v3.4.6.

global
    maxconn @N_PEND_X2@              # WL7 and Appendix B: 2 x N_PEND; it also sets the backlog (lines 3951, 6383 and 9717)
    # nbthread: not set; taskset binds HAProxy to one core, so one thread (Appendix B; line 3115).
    # No log line (Appendix B; audit F9.1). option splice-auto: as M3, only if the server's relay splices.
    # tune.bufsize and tune.maxrewrite: defaults kept, "strongly recommended not to change" (Appendix B; line 4208).

defaults
    mode tcp                         # Appendix B
    @SPLICE_AUTO@
    # timeout client, server and connect: not set (as M3): infinite, which covers the 60 s inspection delay (line 14540).

frontend b3
    bind 127.0.0.1:@PORT@            # backlog: the frontend's maxconn, which defaults to the global value (lines 6383 and 9717)
    tcp-request inspect-delay @TIMER_S@s                        # section 1: 60 s in B3, so no pending connection expires before the last sample
    tcp-request content accept if { req.ssl_hello_type 1 }      # Appendix B (as M3)
    tcp-request content accept if HTTP                          # Appendix B (as M3)
    use_backend tls_stub if { req.ssl_sni -m str oneport.test } # M3's first route: TLS by SNI
    default_backend http_stub                                   # M3's second route: everything else

backend tls_stub
    option use-small-buffers         # Appendix B's buffer table: set with no parameter, in the backends (it cannot be set in a frontend, line 6286; line 12180)
    server stub 127.0.0.1:@STUB_TLS@

backend http_stub
    option use-small-buffers         # Appendix B's buffer table (as above)
    server stub 127.0.0.1:@STUB_HTTP@
