# nginx 1.30.5, stream module with ssl_preread: the M3 configuration (hypotheses.md 5.3 and Appendix
# B; design/proposal.md section 6, CP1). Exactly M3's two routes: TLS by SNI (oneport.test) to the
# stub's TLS port, everything else to the stub's HTTP/1.1 port. bench/competitors/competitors.py
# renders it, filling every field written between @ signs. A line without a comment of its own is
# plumbing of a run; every setting that differs from nginx's default says why. The B3 configuration
# (b3.conf) is this one plus WL7's limits and the 60 s timer.

daemon off;                          # plumbing: the runner owns the process (pid file, process group)
pid @RUN_DIR@/nginx.pid;
error_log @RUN_DIR@/error.log;       # the error log at its default level (error), not a connection log
worker_processes 1;                  # Appendix B: one worker, M3's one front core
worker_cpu_affinity @CPU_MASK@;      # Appendix B: the worker on the front core (CPU @CPU@; taskset puts the master there too)

events {
    multi_accept on;                 # section 5.3 (M3) and Appendix B: "nginx gets multi_accept on"
    # use: not set; nginx picks the event method, epoll with RDHUP on Linux, so its peek path (Appendix B)
    # worker_connections: default 512; M3 holds at most 64 clients and their 64 upstream connections
}

stream {
    # No access_log: the stream module writes none unless one is configured (Appendix B; audit F9.1).
    map $ssl_preread_server_name $oneport_upstream {
        oneport.test  tls_stub;      # M3's first route: TLS by SNI (the test certificate's name, I24)
        default       http_stub;     # M3's second route: everything else (non-TLS leaves the name empty, Appendix B)
    }

    upstream tls_stub {
        server 127.0.0.1:@STUB_TLS@;
    }

    upstream http_stub {
        server 127.0.0.1:@STUB_HTTP@;
    }

    server {
        listen 127.0.0.1:@PORT@;     # backlog: nginx's default, 511 on Linux (Appendix B: as each system sets it)
        ssl_preread on;              # Appendix B
        preread_timeout @TIMER_S@s;          # matched to the server's T_dec (section 1: 3 s); default 30s
        proxy_pass $oneport_upstream;
    }
}
