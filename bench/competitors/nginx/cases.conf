# nginx 1.30.5, stream module with ssl_preread: the cases configuration (hypotheses.md section 10 and
# Appendix B; design/proposal.md section 6, CP1), for the competitors' outcomes on the hard cases of
# Appendix A that nginx's features cover. Every route those features cover: nginx tells a TLS
# ClientHello from anything else and reads its SNI and ALPN (survey 2.1), so TLS for oneport.test
# with no ALPN or offering h2 or http/1.1, the protocols the backend's TLS port serves, goes to the
# backend's TLS port, and everything else to its HTTP/1.1 port (Appendix B: "non-TLS to the HTTP
# upstream"; the docs' example). nginx has no fallback for a silent client (survey 2.1: closed at the timeout),
# so there is no cases-fallback configuration. Two listeners: PORT without PROXY, PORT_PROXY with
# the PROXY header required (PROXY v1 and v2; nginx consumes it and passes on only the bytes after
# it, as the server's relay does, design/status.md M2b reading 2).
# The backend is the server in dedicated mode, PROXY off, its listeners from BACKEND_HTTP in the
# order of I20 (M2b reading 6). Timers: matched to the server's 3 s (T_dec and T_hdr), or, at
# nginx's defaults, the timer lines left out (section 10: "at matched timers and at their
# defaults"); competitors.py renders a line beginning with the field MATCHED as a comment at the
# defaults.

daemon off;                          # plumbing: the runner owns the process (pid file, process group)
pid @RUN_DIR@/nginx.pid;
error_log @RUN_DIR@/error.log;       # the error log at its default level (error), not a connection log
worker_processes 1;                  # Appendix B: one worker, one core
worker_cpu_affinity @CPU_MASK@;      # Appendix B: the worker on the system's core (CPU @CPU@)

events {
    multi_accept on;                 # Appendix B, as M3
}

stream {
    # No access_log (Appendix B).
    # The route: TLS for oneport.test with no ALPN, or whose ALPN list offers h2 or http/1.1 (the
    # server's pass-through route table, bench/server/relay.cpp, exactly);
    # $ssl_preread_alpn_protocols lists the client's protocols separated by commas, and is empty
    # when the ClientHello has no ALPN extension (ngx_stream_ssl_preread_module docs). The pinned
    # build has no PCRE (configure with --without-http: "PCRE library is not used"), so a map key
    # is matched as a string, never as a regex (found in M4b-1): the keys are the lists such a
    # client sends, none (the name, then the space and an empty list), http/1.1 (every TLS case
    # of Appendix A, section 2.1's settings), h2, and both in either order. The key without ALPN
    # was added before the code freeze (Appendix B: "every route its features cover"; M4b-1's
    # reading 4 had left it out).
    map "$ssl_preread_server_name $ssl_preread_alpn_protocols" $oneport_upstream {
        "oneport.test "             tls_backend;    # no ALPN
        "oneport.test http/1.1"     tls_backend;
        "oneport.test h2"           tls_backend;
        "oneport.test h2,http/1.1"  tls_backend;
        "oneport.test http/1.1,h2"  tls_backend;
        default                     http_backend;   # everything else
    }

    upstream tls_backend {
        server 127.0.0.1:@BACKEND_TLS@;
    }

    upstream http_backend {
        server 127.0.0.1:@BACKEND_HTTP@;
    }

    server {
        listen 127.0.0.1:@PORT@;
        listen 127.0.0.1:@PORT_PROXY@ proxy_protocol;   # the PROXY header required on this listener
        ssl_preread on;                                 # Appendix B
@MATCHED@        preread_timeout @TIMER_S@s;                     # matched to T_dec (default 30s)
@MATCHED@        proxy_protocol_timeout @TIMER_S@s;              # matched to T_hdr (default 30s)
        proxy_pass $oneport_upstream;
    }
}
