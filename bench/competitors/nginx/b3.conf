# nginx 1.30.5, stream module with ssl_preread: the B3 configuration (hypotheses.md WL7, 5.2 and
# Appendix B; design/proposal.md section 6, CP1). The M3 configuration (m3.conf) plus WL7's limits
# for N_PEND = @N_PEND@ pending connections, the 60 s timer of section 1, and the buffer rule of
# Appendix B (nginx: defaults kept). bench/competitors/competitors.py renders it.

daemon off;                          # plumbing: the runner owns the process (pid file, process group)
pid @RUN_DIR@/nginx.pid;
error_log @RUN_DIR@/error.log;       # the error log at its default level (error), not a connection log
worker_processes 1;                  # Appendix B: one worker; B3 gives every competitor the server's one core
worker_cpu_affinity @CPU_MASK@;      # Appendix B: the worker on the front core (CPU @CPU@; taskset puts the master there too)
worker_rlimit_nofile @N_PEND_X2@;    # WL7 and Appendix B: 2 x N_PEND; worker_connections cannot exceed the open-file limit

events {
    multi_accept on;                 # section 5.3 and Appendix B (as M3)
    worker_connections @N_PEND_X2@;  # WL7 and Appendix B: 2 x N_PEND, since it counts the connections to proxied servers too
}

stream {
    # No access_log (Appendix B; audit F9.1).
    # preread_buffer_size 16k and proxy_buffer_size 16k: defaults kept (Appendix B's buffer table: no
    # value for many pending connections and no growth is documented; a full preread buffer ends the session).
    map $ssl_preread_server_name $oneport_upstream {
        oneport.test  tls_stub;      # M3's first route: TLS by SNI
        default       http_stub;     # M3's second route: everything else
    }

    upstream tls_stub {
        server 127.0.0.1:@STUB_TLS@;
    }

    upstream http_stub {
        server 127.0.0.1:@STUB_HTTP@;
    }

    server {
        listen 127.0.0.1:@PORT@ backlog=@N_PEND@;   # WL7 and Appendix B: backlog N_PEND (default 511 on Linux)
        ssl_preread on;              # Appendix B
        preread_timeout @TIMER_S@s;          # section 1: 60 s in B3, so no pending connection expires before the last sample
        proxy_pass $oneport_upstream;
    }
}
