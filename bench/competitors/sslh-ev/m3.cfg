# sslh 2.3.1, the sslh-ev binary: the M3 configuration (hypotheses.md 5.3 and Appendix B;
# design/proposal.md section 6, CP5). Exactly M3's two routes: TLS by SNI (oneport.test) to the
# stub's TLS port, everything else to the stub's HTTP/1.1 port. bench/competitors/competitors.py
# renders it, filling every field written between @ signs, and starts `sslh-ev -F <file>` under
# taskset on the front core (sslh-ev runs one thread, doc/INSTALL.md). Every setting that differs
# from sslh's code default (sslhconf.cfg at v2.3.1) says why. The B3 configuration (b3.cfg) is this
# one with the 60 s timer. The listen backlog is 50, hard-coded (common.c line 152): it is not
# configurable.

foreground: true;          # plumbing: the runner owns the process (pid file, process group)
verbose-connections: 0;    # Appendix B: the code default 3 writes a line per connection to stderr and syslog (audit F9.1)
# Logging off, as section 5.3 asks of every system ("Connection logging is off"): sslh formats the
# backend's address for its connect-try message on every connect whatever the verbosity
# (common.c lines 428 to 430), and without numeric that is a name lookup (sprintaddr, lines 718 to
# 745); sslh.pod documents -n, --numeric: "Do not attempt to resolve hostnames ... mostly useful if
# the system's DNS is slow and running the sslh-select variant, as DNS requests will hang all
# connections". sslh-ev, like sslh-select, runs every connection on one thread.
numeric: true;
timeout: @TIMER_S@;        # matched to the server's T_dec, in whole seconds (Appendix B; section 1: 3 s); code default 5
on-timeout: "http";        # M3's second route takes everything else; the code default "ssh" names no protocol of M3

listen: (
    { host: "127.0.0.1"; port: "@PORT@"; }   # max_connections: not set (optional, no default: no limit)
);

protocols: (
    # M3's first route: TLS by SNI. log_level 0: no per-connection log line ("0 to turn off logging",
    # example.cfg; the default 1 logs each incoming connection).
    { name: "tls"; host: "127.0.0.1"; port: "@STUB_TLS@"; sni_hostnames: [ "oneport.test" ]; log_level: 0; },
    # M3's second route: everything else. sslh connects to the last protocol when every probe fails
    # (survey 2.8; probe.c), and the http probe takes HTTP/1.1 itself. log_level 0 as above.
    { name: "http"; host: "127.0.0.1"; port: "@STUB_HTTP@"; log_level: 0; }
);
