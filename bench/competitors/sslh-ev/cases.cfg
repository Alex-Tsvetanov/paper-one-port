# sslh 2.3.1, the sslh-ev binary: the cases configuration (hypotheses.md section 10 and Appendix B;
# design/proposal.md section 6, CP5), for the competitors' outcomes on the hard cases of Appendix A
# that sslh's features cover. Appendix B: probes tls with sni_hostnames, http, ssh, and a regex
# probe for MQTT (built with ENABLE_REGEX); timeout matched in whole seconds; on-timeout names the
# fallback in the fallback cases; verbose-connections 0. Every route those features cover: TLS
# for oneport.test whose ALPN offers h2 or http/1.1 (sni_hostnames and alpn_protocols, both must
# match, example.cfg), TLS for oneport.test with no ALPN (a second tls entry with sni_hostnames
# alone, added before the code freeze; M4b-1's reading 4 had left it out: with both lists set, a
# ClientHello without the extension does not match, tls.c lines 207 to 209 at v2.3.1, and with
# the SNI list alone any ALPN does, so that entry also takes a ClientHello whose ALPN offers
# neither, which the server's route table, bench/server/relay.cpp, closes and no hard case
# sends), SSH, MQTT 3.1.1 and 5.0 by a regex on the CONNECT's first bytes, and HTTP.
# sslh has no h2c probe; its http probe takes any buffer holding "HTTP" (probe.c), the h2c preface
# among them. sslh connects to the last protocol when every probe fails (probe.c, probe_buffer).
# One listener, PORT, without PROXY: sslh reads the PROXY header only when built with
# libproxyprotocol ("Uses proxyprotocol, but libproxyprotocol support was not compiled in", the
# pinned build of bench/competitors/install.sh, M4b-1's cases_check), and Appendix B names no PROXY
# for sslh, so the PROXY cases are not covered. Two kinds from this one file: "cases", no fallback (on-timeout keeps its
# default, ssh); "cases-fallback", on-timeout names the entry "timeout" (example.cfg), the SMTP
# port, last, since sslh probes every entry in order and the "timeout" probe takes any bytes.
# sslh-ev checks the probe timeout only when a connection is readable (survey 2.8; M4a's probes).
# competitors.py renders a line beginning with the field FALLBACK as a comment in "cases", and one
# beginning with MATCHED as a comment at sslh's defaults. The backend is the server in dedicated
# mode, PROXY off, its listeners from BACKEND_HTTP in the order of I20.

foreground: true;          # plumbing: the runner owns the process (pid file, process group)
verbose-connections: 0;    # Appendix B (as M3)
numeric: true;             # logging off (M4a reading 3 of the revision log)
@MATCHED@timeout: @TIMER_S@;        # matched to T_dec, whole seconds (code default 5)
@FALLBACK@on-timeout: "timeout";   # Appendix B: names the fallback in the fallback cases

listen: (
    { host: "127.0.0.1"; port: "@PORT@"; }
);

protocols: (
    { name: "tls"; host: "127.0.0.1"; port: "@BACKEND_TLS@"; sni_hostnames: [ "oneport.test" ]; alpn_protocols: [ "h2", "http/1.1" ];
      log_level: 0; },
    # TLS for oneport.test with no ALPN (and any other list): sslh probes the entries in order.
    { name: "tls"; host: "127.0.0.1"; port: "@BACKEND_TLS@"; sni_hostnames: [ "oneport.test" ]; log_level: 0; },
    { name: "ssh"; host: "127.0.0.1"; port: "@BACKEND_SSH@"; log_level: 0; },
    # MQTT CONNECT (section 1's matcher): 0x10, a Remaining Length of 1 to 4 bytes, 00 04 "MQTT",
    # level 4 or 5; PCRE2's escapes, written with a doubled backslash so libconfig passes them on.
    { name: "regex"; host: "127.0.0.1"; port: "@BACKEND_MQTT@";
      regex_patterns: [ "^\\x10[\\x80-\\xff]{0,3}[\\x00-\\x7f]\\x00\\x04MQTT[\\x04\\x05]" ]; log_level: 0; },
    { name: "http"; host: "127.0.0.1"; port: "@BACKEND_HTTP@"; log_level: 0; }
@FALLBACK@    , { name: "timeout"; host: "127.0.0.1"; port: "@BACKEND_SMTP@"; log_level: 0; }
);
