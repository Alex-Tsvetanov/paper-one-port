# sslh 2.3.1, the sslh-ev binary: the B3 configuration (hypotheses.md WL7, 5.2 and Appendix B;
# design/proposal.md section 6, CP5). The M3 configuration (m3.cfg) with the 60 s timer of
# section 1. WL7's limits: max_connections stays unset on the listen entry and on every protocol
# (optional, no default; doc/max_connections.md describes it as the way to limit connections), and
# the runner raises the soft open-file limit to the hard one. The buffer rule: nothing to configure
# (probing reads into BUFSIZ bytes and keeps them in a queue that grows with realloc). The listen
# backlog is 50, hard-coded (common.c line 152); WL7's pace of 25 per batch respects it.

foreground: true;          # plumbing: the runner owns the process (pid file, process group)
verbose-connections: 0;    # Appendix B (as M3)
numeric: true;             # logging off (as M3: no name lookup for the connect-try message)
timeout: @TIMER_S@;        # section 1 and Appendix B: 60 in B3
on-timeout: "http";        # M3's second route takes everything else (as M3)

listen: (
    { host: "127.0.0.1"; port: "@PORT@"; }   # max_connections: not set (Appendix B)
);

protocols: (
    { name: "tls"; host: "127.0.0.1"; port: "@STUB_TLS@"; sni_hostnames: [ "oneport.test" ]; log_level: 0; },  # TLS by SNI (as M3)
    { name: "http"; host: "127.0.0.1"; port: "@STUB_HTTP@"; log_level: 0; }                                   # everything else (as M3)
);
