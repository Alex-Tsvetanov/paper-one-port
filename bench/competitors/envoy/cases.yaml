# Envoy 1.39.2, the release binary: the cases configuration (hypotheses.md section 10 and Appendix
# B; design/proposal.md section 6, CP3), for the competitors' outcomes on the hard cases of Appendix
# A that Envoy's features cover. Appendix B: tls_inspector and http_inspector, proxy_protocol in the
# PROXY cases; filter chains by server_names, transport_protocol and application_protocols;
# tcp_proxy; listener_filters_timeout matched; continue_on_listener_filters_timeout true only in
# the fallback cases. Every route those features cover: TLS for oneport.test whose ALPN offers h2
# or http/1.1 (the protocols the backend's TLS port serves) to the backend's TLS port, and TLS for
# oneport.test with no ALPN to the same port (a second chain, added before the code freeze; M4b-1's
# reading 4 had left it out). FilterChainMatch has no form for "no application protocol": a chain
# without application_protocols matches any, and the more specific chain takes h2 and http/1.1
# first (FilterChainMatch, application protocols the fifth criterion), so the second chain also
# takes a ClientHello for oneport.test whose ALPN offers neither, which the server's route table
# (bench/server/relay.cpp) closes and no hard case sends; plaintext
# that http_inspector reports as h2c to its h2c port, as http/1.1 or http/1.0 to its HTTP/1.1
# port (survey 2.5); SSH and MQTT have no inspector, so no chain takes them. Two listeners: PORT
# without PROXY, PORT_PROXY with the proxy_protocol filter first (the header required, Envoy's
# default; Envoy consumes it). Two kinds from this one file: "cases", no fallback (a connection no
# chain takes is closed); "cases-fallback", the default chain to the SMTP port, which takes a
# connection whose listener filters timed out (continue_on_listener_filters_timeout). competitors.py
# renders a line beginning with the field FALLBACK as a comment in "cases", and one beginning with
# MATCHED as a comment at Envoy's defaults. Started as M3 (--concurrency 1, --disable-hot-restart);
# no admin listener, no access log, default statistics (Appendix B). The backend is the server in
# dedicated mode, PROXY off, its listeners from BACKEND_HTTP in the order of I20.
static_resources:
  listeners:
  - name: cases
    address:
      socket_address: { address: 127.0.0.1, port_value: @PORT@ }
@MATCHED@    listener_filters_timeout: @TIMER_S@s     # matched to T_dec (default 15s)
@FALLBACK@    continue_on_listener_filters_timeout: true   # Appendix B: only in the fallback cases
    listener_filters:
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    - name: envoy.filters.listener.http_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.http_inspector.v3.HttpInspector
    filter_chains: &chains
    - filter_chain_match:
        server_names: [ "oneport.test" ]
        transport_protocol: tls
        application_protocols: [ "h2", "http/1.1" ]
      filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: tls_backend
          cluster: tls_backend
    - filter_chain_match:               # TLS for oneport.test with no ALPN (and, by Envoy's matching, any other list)
        server_names: [ "oneport.test" ]
        transport_protocol: tls
      filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: tls_backend_no_alpn
          cluster: tls_backend
    - filter_chain_match:
        transport_protocol: raw_buffer
        application_protocols: [ "h2c" ]
      filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: h2c_backend
          cluster: h2c_backend
    - filter_chain_match:
        transport_protocol: raw_buffer
        application_protocols: [ "http/1.1", "http/1.0" ]
      filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: http_backend
          cluster: http_backend
@FALLBACK@    default_filter_chain: &fallback
@FALLBACK@      filters:
@FALLBACK@      - name: envoy.filters.network.tcp_proxy
@FALLBACK@        typed_config:
@FALLBACK@          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
@FALLBACK@          stat_prefix: smtp_backend
@FALLBACK@          cluster: smtp_backend
  - name: cases_proxy
    address:
      socket_address: { address: 127.0.0.1, port_value: @PORT_PROXY@ }
@MATCHED@    listener_filters_timeout: @TIMER_S@s     # matched to T_dec and T_hdr (default 15s); it bounds the PROXY header too
@FALLBACK@    continue_on_listener_filters_timeout: true
    listener_filters:
    - name: envoy.filters.listener.proxy_protocol   # Appendix B: proxy_protocol in the PROXY cases
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.proxy_protocol.v3.ProxyProtocol
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    - name: envoy.filters.listener.http_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.http_inspector.v3.HttpInspector
    filter_chains: *chains
@FALLBACK@    default_filter_chain: *fallback
  clusters:
  - name: tls_backend
    type: STATIC
    circuit_breakers: &unlimited               # disabled, as M3 (the benchmarking FAQ)
      thresholds:
      - { priority: DEFAULT, max_connections: 1000000000, max_pending_requests: 1000000000, max_requests: 1000000000, max_retries: 1000000000 }
      - { priority: HIGH, max_connections: 1000000000, max_pending_requests: 1000000000, max_requests: 1000000000, max_retries: 1000000000 }
    load_assignment:
      cluster_name: tls_backend
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: @BACKEND_TLS@ } } }
  - name: h2c_backend
    type: STATIC
    circuit_breakers: *unlimited
    load_assignment:
      cluster_name: h2c_backend
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: @BACKEND_H2C@ } } }
  - name: http_backend
    type: STATIC
    circuit_breakers: *unlimited
    load_assignment:
      cluster_name: http_backend
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: @BACKEND_HTTP@ } } }
@FALLBACK@  - name: smtp_backend
@FALLBACK@    type: STATIC
@FALLBACK@    circuit_breakers: *unlimited
@FALLBACK@    load_assignment:
@FALLBACK@      cluster_name: smtp_backend
@FALLBACK@      endpoints:
@FALLBACK@      - lb_endpoints:
@FALLBACK@        - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: @BACKEND_SMTP@ } } }
