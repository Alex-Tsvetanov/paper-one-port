# Envoy 1.39.2, the release binary: the M3 configuration (hypotheses.md 5.3 and Appendix B;
# design/proposal.md section 6, CP3). Exactly M3's two routes: TLS by SNI (oneport.test) to the
# stub's TLS port, everything else to the stub's HTTP/1.1 port. bench/competitors/competitors.py
# renders it, filling every field written between @ signs, and starts Envoy with --concurrency 1
# (Appendix B: the benchmarking FAQ's "set to match the number of cores ... made available to other
# network proxies", here 1) and --disable-hot-restart (plumbing: two Envoys on one host share no
# memory). The B3 configuration (b3.yaml) is this one plus WL7's limits, the 60 s timer and the
# buffer rule. No admin listener and no access log are configured (Appendix B); the default
# statistics stay on, as the server's counters do (section 5.3).
static_resources:
  listeners:
  - name: m3
    address:
      socket_address: { address: 127.0.0.1, port_value: @PORT@ }
    # tcp_backlog_size: not set; Envoy then uses net.core.somaxconn on Linux (Appendix B: backlogs as each system sets them).
    listener_filters_timeout: @TIMER_S@s     # matched to the server's T_dec (section 1: 3 s; Appendix B); default 15s
    # continue_on_listener_filters_timeout: default false; true only in the fallback cases (Appendix B).
    listener_filters:
    - name: envoy.filters.listener.tls_inspector   # Appendix B: SNI for the first route; http_inspector is not added, since no M3 route reads HTTP (the FAQ: filter chains only for the compared features)
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    filter_chains:
    - filter_chain_match:                    # M3's first route: TLS by SNI (Appendix B: filter chains by server_names and transport_protocol)
        server_names: [ "oneport.test" ]
        transport_protocol: tls
      filters:
      - name: envoy.filters.network.tcp_proxy  # Appendix B: tcp_proxy (pass-through, no termination)
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: tls_stub
          cluster: tls_stub
    default_filter_chain:                    # M3's second route: everything else (no chain matched)
      filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: http_stub
          cluster: http_stub
  clusters:
  - name: tls_stub
    type: STATIC
    # Circuit breaking disabled, as the benchmarking FAQ asks, with the thresholds of the FAQ "Is
    # there a way to disable circuit breaking?" (v1.39.2): 1000000000 at both priorities.
    circuit_breakers:
      thresholds:
      - { priority: DEFAULT, max_connections: 1000000000, max_pending_requests: 1000000000, max_requests: 1000000000, max_retries: 1000000000 }
      - { priority: HIGH, max_connections: 1000000000, max_pending_requests: 1000000000, max_requests: 1000000000, max_retries: 1000000000 }
    load_assignment:
      cluster_name: tls_stub
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: @STUB_TLS@ } } }
  - name: http_stub
    type: STATIC
    circuit_breakers:                        # as above (the FAQ)
      thresholds:
      - { priority: DEFAULT, max_connections: 1000000000, max_pending_requests: 1000000000, max_requests: 1000000000, max_retries: 1000000000 }
      - { priority: HIGH, max_connections: 1000000000, max_pending_requests: 1000000000, max_requests: 1000000000, max_retries: 1000000000 }
    load_assignment:
      cluster_name: http_stub
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: @STUB_HTTP@ } } }
